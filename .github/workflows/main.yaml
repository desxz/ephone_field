name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.10.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run package tests
        run: flutter test --coverage

      - name: Example app dependencies
        run: flutter pub get
        working-directory: example

      - name: Run example tests
        run: flutter test
        working-directory: example

      - name: Example Android assemble (native libphonenumber smoke)
        if: matrix.flutter == 'stable'
        run: flutter build apk --debug
        working-directory: example

      - name: Publish dry-run
        if: matrix.flutter == 'stable'
        run: flutter pub publish --dry-run

      - name: Upload coverage to Codecov
        if: matrix.flutter == 'stable' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ios:
    name: iOS native smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CMake
        run: brew install cmake

      - name: Cache FetchContent native deps
        uses: actions/cache@v4
        with:
          path: |
            ios/build/iphonesimulator-arm64/_deps
            ios/prebuilt
          key: ephone-ios-deps-${{ hashFiles('src/CMakeLists.txt', 'src/cmake/EphoneMobileDeps.cmake', 'third_party/LIBPHONENUMBER_VERSION', 'tool/patches/*.patch', 'ios/ephone_exports.txt') }}
          restore-keys: |
            ephone-ios-deps-

      - name: Example iOS build (native libphonenumber smoke)
        run: flutter build ios --debug --no-codesign --simulator
        working-directory: example

      - name: Assert iOS stack exports only ephone_* C API
        run: |
          set -euo pipefail
          ARCH="ios/build/libephone_phonenumber_stack-iphonesimulator.a"
          test -f "$ARCH"
          GLOBALS="$(nm -gU "$ARCH" | awk '/ [TDS] / { print $NF }')"
          echo "$GLOBALS"
          echo "$GLOBALS" | grep -qv '^_ephone_' && {
            echo "Unexpected non-C-API global symbol(s) in $ARCH" >&2
            exit 1
          }
          echo "$GLOBALS" | grep -q '_ephone_phone_is_valid'
          COUNT="$(echo "$GLOBALS" | grep -c '^_ephone_')"
          test "$COUNT" -eq 12

      - name: Stage simulator prebuilt for artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p ios/prebuilt
          cp -f ios/build/libephone_phonenumber_stack-iphonesimulator.a \
            ios/prebuilt/libephone_phonenumber_stack-iphonesimulator.a
          ls -lh ios/prebuilt/

      - name: Upload iOS prebuilt stack (simulator)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ephone-ios-prebuilt-iphonesimulator
          path: ios/prebuilt/libephone_phonenumber_stack-iphonesimulator.a
          if-no-files-found: error
          retention-days: 14
