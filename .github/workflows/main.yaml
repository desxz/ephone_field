name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter_version: '3.41.4'
            channel: stable
            is_latest: false
          - flutter_version: ''
            channel: stable
            is_latest: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (pinned)
        if: matrix.flutter_version != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: ${{ matrix.channel }}
          cache: true

      - name: Setup Flutter (channel latest)
        if: matrix.flutter_version == ''
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assert shipped native prebuilts
        if: matrix.is_latest
        run: |
          chmod +x tool/assert_prebuilts.sh
          ./tool/assert_prebuilts.sh

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run package tests
        run: flutter test --coverage

      - name: Example app dependencies
        run: flutter pub get
        working-directory: example

      - name: Run example tests
        run: flutter test
        working-directory: example

      - name: Example Android assemble (prebuilt jniLibs smoke)
        if: matrix.is_latest
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation
          # Flutter may rewrite gradle.properties during the build; restore so
          # publish --dry-run does not fail on a dirty git tree.
          git checkout -- android/gradle.properties
        working-directory: example

      - name: Publish dry-run
        if: matrix.is_latest
        run: flutter pub publish --dry-run

      - name: Upload coverage to Codecov
        if: matrix.is_latest && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ios:
    name: iOS native smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (CocoaPods FFI plugin)
        run: flutter config --no-enable-swift-package-manager

      - name: Assert shipped iOS prebuilts
        run: |
          chmod +x tool/assert_prebuilts.sh
          ./tool/assert_prebuilts.sh

      - name: Example iOS build (prebuilt stack smoke)
        working-directory: example
        run: |
          set -euo pipefail
          if ! flutter build ios --debug --no-codesign --simulator; then
            echo '::group::Verbose iOS rebuild for diagnostics'
            flutter build ios --debug --no-codesign --simulator -v || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Assert iOS stack exports only ephone_* C API
        run: |
          set -euo pipefail
          ARCH="ios/build/libephone_phonenumber_stack-iphonesimulator.a"
          test -f "$ARCH"
          GLOBALS="$(nm -gU "$ARCH" | awk '/ [TDS] / { print $NF }')"
          echo "$GLOBALS"
          echo "$GLOBALS" | grep -qv '^_ephone_' && {
            echo "Unexpected non-C-API global symbol(s) in $ARCH" >&2
            exit 1
          }
          echo "$GLOBALS" | grep -q '_ephone_phone_is_valid'
          COUNT="$(echo "$GLOBALS" | grep -c '^_ephone_')"
          test "$COUNT" -eq 13
